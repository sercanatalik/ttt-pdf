name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  TTT_REPO: eugenioenko/ttt

jobs:
  test:
    name: test (ttt ${{ matrix.ttt-ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, and main for early warning of changes.
        ttt-ref: [v1.8.0, main]
    steps:
      - uses: actions/checkout@v7

      - name: Check out ttt
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TTT_REPO }}
          ref: ${{ matrix.ttt-ref }}
          path: .ttt

      - uses: actions/setup-go@v7
        with:
          go-version-file: .ttt/go.mod
          cache-dependency-path: .ttt/go.sum

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build ttt
        working-directory: .ttt
        run: go build -o "$RUNNER_TEMP/ttt" ./cmd/ttt

      - name: Run tests
        run: TTT_BIN="$RUNNER_TEMP/ttt" tests/run.sh
